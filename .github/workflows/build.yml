# Compila il gioco Godot (cartella godot/) a ogni push, su tutti i branch:
# controlla gli script, esegue il test delle meccaniche ed esporta Windows e Linux.
# Solo su main crea la Release "v<config/version>" se non esiste già (non cancella mai nulla).
name: Build del gioco

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_DIR: /home/runner/godot-bin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: C'è il progetto Godot?
        id: progetto
        run: |
          if [ -f godot/project.godot ]; then echo "presente=si" >> "$GITHUB_OUTPUT"; else echo "presente=no" >> "$GITHUB_OUTPUT"; echo "Nessun godot/project.godot su questo branch: salto la build."; fi

      - name: Cache di Godot e dei template
        if: steps.progetto.outputs.presente == 'si'
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-v1

      - name: Scarica Godot e i template
        if: steps.progetto.outputs.presente == 'si'
        run: |
          bash tools/godot_ci_setup.sh
          echo "$GODOT_BIN_DIR" >> "$GITHUB_PATH"

      - name: Versione del gioco
        if: steps.progetto.outputs.presente == 'si'
        id: versione
        run: |
          VER=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' godot/project.godot)
          if [ -z "$VER" ]; then echo "config/version mancante in project.godot"; exit 1; fi
          echo "versione=$VER" >> "$GITHUB_OUTPUT"
          echo "Versione: $VER"

      - name: Importa il progetto
        if: steps.progetto.outputs.presente == 'si'
        run: |
          godot --headless --path godot --import
          # Le texture estratte dai GLB vanno in compressione VRAM (meno memoria), poi si reimporta.
          python3 tools/godot_vram_textures.py godot
          godot --headless --path godot --import

      - name: Controllo degli script
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/check_scripts.gd

      - name: Test delle meccaniche
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_mechanics.gd

      - name: Test dell'esportazione (i file esclusi dal pacchetto non servono al gioco)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_esportazione.gd

      - name: Test del nome nuovo (Jilly Jubilee) e dei dati della cartella di Splash Lagoon
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_nome_nuovo.gd

      - name: Test della demo (sala principale)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_sala.gd

      - name: Test dell'audio
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_audio.gd

      - name: Test del menu (titolo, caricamento, pausa)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_menu.gd

      - name: Test dello spot VHS (lettore, audio ai tempi, salto tenendo premuto)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/spot/test_lettore_spot.gd

      - name: Test dei bambini (scene, animazioni, modalità)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_bambini.gd

      - name: Test degli interni (corridoio, spogliatoi, stanzino)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_interni.gd

      - name: Test della luce viola e della nebbia della scena dello squalo
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_squalo_viola.gd

      - name: Test dei passaggi degli interni (il giocatore entra ed esce da ogni porta e varco)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_passaggi_interni.gd

      - name: Test delle animazioni di lei per l'inseguimento
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_lei_animazioni.gd

      - name: Test della voce di lei nell'inseguimento
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_lei_voce.gd

      - name: Test degli ambienti tecnici (camera delle onde, sala pompe)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_tecnici.gd

      - name: Test delle tappe 5-6 (dalla pozza al raccordo, il risveglio)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_tappe56.gd

      - name: Test della tappa 7 (il ritorno al buio)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_tappa7.gd

      - name: Test della tappa 8 (lei sbuca dal bordo, la strada verso la torre)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_tappa8.gd

      - name: Test dello spavento vero della tappa 8 (dalla serranda lei ti prende alla fossa, la sequenza intera senza saltarla, la sala si ricarica a caricamenti nel thread finiti, 30 s di gioco senza errori)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_presa_vera.gd

      - name: Test dei tentacoli morbidi di lei (affacciata e tuffo; collisioni bloccanti, costo solo stampato)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 30 --script res://tests/run.gd -- res://tests/test_morbidezza.gd

      - name: Test dei tentacoli morbidi di lei che sbuca (collisioni bloccanti, costo solo stampato)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 30 --script res://tests/run.gd -- res://tests/test_morbidezza_sbuca.gd

      - name: Test dei tentacoli morbidi nell'inseguimento (collisioni bloccanti, costo solo stampato)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 30 --script res://tests/run.gd -- res://tests/test_morbidezza_inseguimento.gd

      - name: Test della vista subacquea (con la testa sopra il pelo di ogni acqua resta normale, anche con due acque sovrapposte)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_vista_subacquea.gd

      - name: Test dei tentacoli morbidi nel tunnel sottomarino (presa, strada intera, curve; pelle vera bloccante, costo solo stampato)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 30 --script res://tests/run.gd -- res://tests/test_morbidezza_tunnel.gd

      - name: Materiali campione del tunnel sottomarino (ogni shader del tunnel ha il suo, niente scatti la prima volta)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/aggiorna_campioni_tunnel.gd controlla

      - name: Test delle forme che si muovono della morbidezza (galleggianti e portello del tunnel)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_morbidezza_mobili.gd

      - name: Test della statua di lei con la morbidezza a 0 (ferma, costo zero)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 30 --script res://tests/run.gd -- res://tests/test_morbidezza_statua.gd

      - name: Test degli scivoli (la discesa della sala della torre)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_scivoli.gd

      - name: Test della sala della torre (discesa, checkpoint, caricamento dal portone)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_torre.gd

      - name: Test della riserva della torre (thread lento al portone)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_torre_riserva.gd

      - name: Test del guado nel canale del tunnel sottomarino (velocità, risalita, aspirazione)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_guado.gd

      - name: Test del parkour sui gommoni del tunnel sottomarino (salti veri, appoggio, corde, compenetrazioni)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_parkour_gommoni.gd

      - name: Test degli oblò con lei dietro il vetro (compare fuori vista, ti segue con l'occhio, se ne va se guardi via o ti avvicini, una volta sola, resta nella vasca)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_oblo_lei.gd

      - name: Test dell'oblò con lei nella torre (nel foro del muro, compare una volta, va via entrando nella bocca)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_oblo_torre.gd

      - name: Il muro attorno all'oblò della torre salvato corrisponde alla mesh della torre
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/aggiorna_muro_oblo_torre.gd controlla

      - name: Test della distanza di lei nei passaggi obbligati del tunnel (gommoni e gallerie basse; mai sotto gli 8 m finché non sbagli, se cadi in acqua ti prende)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_tunnel_attraversamenti.gd

      - name: Test dell'inseguimento (le condotte, SB1)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_inseguimento.gd

      - name: Test della scaletta del bacino dopo SB1 (su col giocatore vero in quattro modi, poi oltre la porta nel tunnel)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_scaletta_bacino.gd

      - name: Test delle gallerie di servizio del tunnel sottomarino (dentro col giocatore vero, centrati e spostati di 30 cm, senza fermarsi)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_gallerie_sottomarino.gd

      - name: Test del finale del tunnel sottomarino (E dalla camera stagna da vicino e da lontano, il battente non spinge, lo schianto si vede)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_portello_sottomarino.gd

      - name: Test dell'enigma degli acquari
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_acquari.gd

      - name: Test dell'uscita dal gioco con un caricamento nel thread in corso
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_uscita.gd

      - name: Test della Polaroid 4 (si raggiunge e si raccoglie col controller vero)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_polaroid.gd

      - name: Controllo di posizionamento (sospesi, ingombri dove si cammina, interattivi coperti, compenetrazioni)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/controllo_posizionamento.gd

      - name: Controllo dei varchi (il corpo del giocatore passa da ogni porta della strada; blocca la build)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/controllo_varchi.gd

      - name: Test della strada del capitolo col controller vero (dal risveglio alla torre, porta per porta)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_strada.gd

      - name: Test di Posa (lo strumento comune per mettere gli oggetti)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_posa.gd

      - name: Test del primo uso, dell'ingresso nella torre e di lei negli oblò (niente blocchi; renderer Vulkan software)
        if: steps.progetto.outputs.presente == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb > /dev/null
          tools/ci/senza_bug.sh xvfb-run -a -s "-screen 0 320x180x24" godot --path godot --rendering-driver vulkan --resolution 320x180 --script res://tests/run.gd -- res://tests/test_primo_uso.gd
          tools/ci/senza_bug.sh xvfb-run -a -s "-screen 0 320x180x24" godot --path godot --rendering-driver vulkan --resolution 320x180 --script res://tests/run.gd -- res://tests/test_torre_ingresso.gd
          tools/ci/senza_bug.sh xvfb-run -a -s "-screen 0 320x180x24" godot --path godot --rendering-driver vulkan --resolution 320x180 --script res://tests/run.gd -- res://tests/test_riscaldamento_pipeline.gd
          tools/ci/senza_bug.sh xvfb-run -a -s "-screen 0 320x180x24" godot --path godot --rendering-driver vulkan --resolution 320x180 --script res://tests/run.gd -- res://tests/test_oblo_leggeri.gd

      - name: Test dell'attesa delle zone (thread rallentato apposta; la porta aspetta, niente fotogrammi sopra 100 ms)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_attesa_zone.gd

      - name: Test degli strati di disegno (nessuno condiviso senza volerlo; quello della preparazione non si vede)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_strati.gd

      - name: Test delle forme salvate del tunnel sottomarino (come quelle calcolate; l'involucro come tutte le facce)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_forme_tunnel.gd

      - name: Test delle posizioni del tunnel sottomarino (con e senza le scorciatoie dei blocchi, scarto sotto 1 mm)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --script res://tests/run.gd -- res://tests/test_posizioni_tunnel.gd

      - name: Test del prototipo del fiume lento
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_fiume.gd

      - name: Test del prototipo dell'infermeria
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_infermeria.gd

      - name: Test del fiume lento del gioco
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_fiume_gioco.gd

      - name: Test dell'infermeria del gioco
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_infermeria_gioco.gd

      - name: Test della strada nuova della risalita
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_risalita.gd

      - name: Test della risalita caricata più tardi (memoria)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_risalita_tardi.gd

      - name: Le ciambelle tolte dal fiume stanno sulla riva, nel gioco vero
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_ciambelle_riva.gd

      - name: Finita la demo, il gioco torna da solo al titolo
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_fine_titolo.gd

      - name: Le ante degli armadietti, anche quella che sbatte in tutta la corsa, senza niente dentro
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_ante_armadietti.gd

      - name: Test del menu di prova nascosto (partenze da F9 nel titolo)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_partenze_prova.gd

      - name: Nessuna istanza di MultiMesh specchiata e facce dei MultiMesh nel verso giusto
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_multimesh_specchiati.gd

      - name: Test della luce normale (luci bianche al 40%, fisse)
        if: steps.progetto.outputs.presente == 'si'
        run: godot --headless --path godot --fixed-fps 60 --script res://tests/run.gd -- res://tests/test_luci_bianche.gd

      - name: Test del blocco del pool di thread (la sala al primo fotogramma con 4 worker; renderer Vulkan software)
        if: steps.progetto.outputs.presente == 'si'
        timeout-minutes: 20
        run: |
          # 4 worker, come sulle macchine dei giocatori con 4 core. Il test esce senza aspettare il pool
          # (le pipeline in coda col renderer software occupano più di 12 GB): conta la riga RISULTATO.
          printf '[threading]\nworker_pool/max_threads=4\n' > godot/override.cfg
          xvfb-run -a -s "-screen 0 320x180x24" godot --path godot --rendering-driver vulkan --resolution 320x180 --script res://tests/run.gd -- res://tests/test_pool_sala.gd 2>&1 | tee pool_sala.log || true
          rm -f godot/override.cfg
          grep -q "RISULTATO: [0-9]* controlli ok, 0 falliti" pool_sala.log
          # e nessun errore interno del motore (tools/ci/senza_bug.sh)
          ! grep -n "ERROR: BUG," pool_sala.log

      - name: Esporta Windows e Linux
        if: steps.progetto.outputs.presente == 'si'
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/JillyJubilee.exe
          godot --headless --path godot --export-release "Linux" ../build/linux/JillyJubilee.x86_64
          test -f build/windows/JillyJubilee.exe -a -f build/windows/JillyJubilee.pck
          test -f build/linux/JillyJubilee.x86_64 -a -f build/linux/JillyJubilee.pck
          # Windows in un solo file: il .pck è dentro l'eseguibile (si avvia con un doppio clic, senza scompattare).
          mkdir -p build/windows_unico
          godot --headless --path godot --export-release "Windows Portatile" ../build/windows_unico/JillyJubilee.exe
          test "$(stat -c %s build/windows_unico/JillyJubilee.exe)" -gt 100000000
          V="${{ steps.versione.outputs.versione }}"
          (cd build/windows && zip -9 -q "../JillyJubilee-windows-v$V.zip" JillyJubilee.exe JillyJubilee.pck)
          (cd build/linux && zip -9 -q "../JillyJubilee-linux-v$V.zip" JillyJubilee.x86_64 JillyJubilee.pck)
          # GitHub non accetta file di Release sopra i 2 GiB: l'exe unico si pubblica solo sotto 1,95 GB,
          # altrimenti resta solo lo zip (docs/tecnico/peso_build.md: cosa si può alleggerire).
          LIMITE_EXE=1950000000
          PESO_EXE=$(stat -c %s build/windows_unico/JillyJubilee.exe)
          if [ "$PESO_EXE" -lt "$LIMITE_EXE" ]; then
            cp build/windows_unico/JillyJubilee.exe "build/JillyJubilee-windows-v$V.exe"
            echo "Exe unico: $((PESO_EXE / 1000000)) MB (pubblicato; limite $((LIMITE_EXE / 1000000)) MB)"
          else
            echo "::warning title=Exe unico non pubblicato::L'exe unico pesa $((PESO_EXE / 1000000)) MB, sopra il limite di $((LIMITE_EXE / 1000000)) MB: nella Release c'è solo lo zip di Windows. Vedi docs/tecnico/peso_build.md per alleggerire il pacchetto."
          fi
          for z in build/*.zip; do
            if [ "$(stat -c %s "$z")" -ge 2147483648 ]; then
              echo "::error title=Zip troppo grande::$z supera i 2 GiB, GitHub non lo accetta nella Release. Vedi docs/tecnico/peso_build.md."
              exit 1
            fi
          done
          # Pacchetti: i doppioni tolti da EsportaSenzaDoppioni rimandano a dati che ci sono; peso per cartella.
          python3 tools/verifica_pck.py build/windows/JillyJubilee.pck 20
          python3 tools/verifica_pck.py build/linux/JillyJubilee.pck 0
          python3 tools/verifica_pck.py build/windows_unico/JillyJubilee.exe 0
          ls -la build

      - name: Carica la build Windows
        if: steps.progetto.outputs.presente == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: JillyJubilee-windows-v${{ steps.versione.outputs.versione }}
          path: build/windows/

      - name: Carica la build Linux
        if: steps.progetto.outputs.presente == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: JillyJubilee-linux-v${{ steps.versione.outputs.versione }}
          path: build/linux/

      - name: Release (solo su main; crea la Release o aggiunge i file che mancano)
        if: steps.progetto.outputs.presente == 'si' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.versione.outputs.versione }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Non si sostituisce e non si cancella niente: si aggiungono solo i file con un nome nuovo.
            echo "La Release $TAG esiste già: aggiungo solo i file che mancano. Per una versione nuova alza config/version."
            if [ -f "docs/release/$TAG.md" ]; then gh release edit "$TAG" --notes-file "docs/release/$TAG.md"; fi
            PRESENTI=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for f in build/*.zip build/*.exe; do
              [ -f "$f" ] || continue
              n=$(basename "$f")
              if printf '%s\n' "$PRESENTI" | grep -qxF "$n"; then
                echo "c'è già: $n"
              else
                gh release upload "$TAG" "$f"
              fi
            done
          else
            # Le note della versione, se ci sono (docs/release/<tag>.md); se no, quelle di riserva.
            if [ -f "docs/release/$TAG.md" ]; then
              NOTE=(--notes-file "docs/release/$TAG.md")
            else
              NOTE=(--notes "Demo giocabile della sala principale (build automatica del commit $GITHUB_SHA). Windows: scompatta lo zip e avvia JillyJubilee.exe (tieni JillyJubilee.pck nella stessa cartella).")
            fi
            shopt -s nullglob
            FILE=(build/*.zip build/*.exe)
            gh release create "$TAG" "${FILE[@]}" \
              --target "$GITHUB_SHA" \
              --title "Jilly Jubilee $TAG" \
              "${NOTE[@]}"
          fi
