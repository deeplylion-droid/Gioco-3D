# La prova del gioco esportato su Windows vero (crash della 0.3.17 sulle partenze dopo la torre): esporta Windows
# come la build, poi su windows-latest lancia ogni partenza diretta (--partenza=<id>, vedi menu_principale.gd) con D3D12
# e con Vulkan software (lavapipe di mesa-dist-win), e salva il registro di Godot, il codice d'uscita e le ultime righe.
# Gira solo sul branch lavoro/prova-windows (e a mano); la build normale su questo branch non parte (build.yml).
name: Prova su Windows

on:
  push:
    branches: ["lavoro/prova-windows"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prova-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_DIR: /home/runner/godot-bin

jobs:
  esporta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache di Godot e dei template
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GODOT_BIN_DIR }}
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-v1

      - name: Scarica Godot e i template
        run: |
          bash tools/godot_ci_setup.sh
          echo "$GODOT_BIN_DIR" >> "$GITHUB_PATH"

      - name: Importa il progetto (come la build)
        run: |
          godot --headless --path godot --import
          python3 tools/godot_vram_textures.py godot
          godot --headless --path godot --import
          python3 tools/godot_vram_textures.py godot
          godot --headless --path godot --import

      - name: Esporta Windows
        run: |
          mkdir -p build/windows
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/JillyJubilee.exe
          test -f build/windows/JillyJubilee.exe -a -f build/windows/JillyJubilee.pck

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
          retention-days: 3

  prova:
    needs: esporta
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # il driver di serie (D3D12, come l'utente); descrittori: il limite di D3D12 per la prova, scritto in override.cfg
        # accanto all'exe (65536 è quello di serie della 0.3.17; fra 65536 e 524288 si vede quanti ne servono al picco)
        include:
          - {partenza: torre, descrittori: 65536}
          - {partenza: torre, descrittori: 131072}
          - {partenza: torre, descrittori: 262144}
          - {partenza: torre, descrittori: 524288}
          - {partenza: inseguimento, descrittori: 65536}
          - {partenza: inseguimento, descrittori: 524288}
          - {partenza: tunnel, descrittori: 524288}
          - {partenza: fiume, descrittori: 524288}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: gioco

      - name: Limite dei descrittori ${{ matrix.descrittori }}
        shell: pwsh
        run: |
          "[rendering]`nrendering_device/d3d12/max_resource_descriptors=${{ matrix.descrittori }}`n" | Out-File -Encoding ascii gioco\override.cfg
          Get-Content gioco\override.cfg

      - name: Partenza ${{ matrix.partenza }}, descrittori ${{ matrix.descrittori }}
        shell: pwsh
        run: |
          $nome = "${{ matrix.partenza }}_${{ matrix.descrittori }}"
          $log = "$PWD\godot_$nome.log"
          $arg = "--resolution 1280x720 --log-file `"$log`" -- --partenza=${{ matrix.partenza }} --resta=60"
          $p = Start-Process -FilePath gioco\JillyJubilee.exe -ArgumentList $arg -PassThru
          $finito = $p.WaitForExit(165 * 60 * 1000)
          if (-not $finito) { Write-Host "ANCORA ACCESO dopo 165 min: lo chiudo"; $p.Kill(); $p.WaitForExit() }
          $codice = $p.ExitCode
          Write-Host ("CODICE D'USCITA: {0} (0x{1:X8})" -f $codice, $codice)
          "$nome codice=$codice finito=$finito" | Out-File esito.txt
          if (Test-Path $log) {
            Select-String -Path $log -Pattern 'Using Device|PROVA: |descriptor heap|CRASH|Exception' | Select-Object -First 12 | ForEach-Object { $_.Line }
            Write-Host "--- errori dei descrittori: $((Select-String -Path $log -Pattern 'descriptor heap').Count)"
            Write-Host "--- ultime righe PROVA:"
            Select-String -Path $log -Pattern '^PROVA' | Select-Object -Last 6 | ForEach-Object { $_.Line }
          } else { Write-Host "NESSUN REGISTRO" }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 1 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-${{ matrix.partenza }}-${{ matrix.descrittori }}
          path: |
            godot_*.log
            esito.txt
          retention-days: 7
