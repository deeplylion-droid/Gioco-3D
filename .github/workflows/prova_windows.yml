# La prova del gioco esportato su Windows vero (crash della 0.3.17 sulle partenze dopo la torre): esporta Windows
# come la build, poi su windows-latest lancia ogni partenza diretta (--partenza=<id>, vedi menu_principale.gd) con D3D12
# e con Vulkan software (lavapipe di mesa-dist-win), e salva il registro di Godot, il codice d'uscita e le ultime righe.
# Gira solo sul branch lavoro/prova-windows (e a mano); la build normale su questo branch non parte (build.yml).
name: Prova su Windows

on:
  push:
    branches: ["lavoro/prova-windows", "lavoro/prova-windows-0316"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prova-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN_DIR: /home/runner/godot-bin

jobs:
  esporta:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache di Godot e dei template
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GODOT_BIN_DIR }}
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates-v1

      - name: Scarica Godot e i template
        run: |
          bash tools/godot_ci_setup.sh
          echo "$GODOT_BIN_DIR" >> "$GITHUB_PATH"

      - name: Importa il progetto (come la build)
        run: |
          godot --headless --path godot --import
          python3 tools/godot_vram_textures.py godot
          godot --headless --path godot --import
          python3 tools/godot_vram_textures.py godot
          godot --headless --path godot --import

      - name: Esporta Windows
        run: |
          mkdir -p build/windows
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/JillyJubilee.exe
          test -f build/windows/JillyJubilee.exe -a -f build/windows/JillyJubilee.pck

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
          retention-days: 3

  prova:
    needs: esporta
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # driver: d3d12 è quello di serie (come l'utente); swiftshader è Vulkan software, quello di Chrome sul runner.
        # descrittori: il limite di D3D12 della prova, in override.cfg accanto all'exe (65536 è quello di serie della 0.3.17)
        include:
          - {partenza: torre, descrittori: 65536, preset: alto, driver: d3d12}
          - {partenza: torre, descrittori: 524288, preset: alto, driver: d3d12}
          - {partenza: torre, descrittori: 524288, preset: basso, driver: d3d12}
          - {partenza: inseguimento, descrittori: 65536, preset: alto, driver: d3d12}
          - {partenza: inseguimento, descrittori: 524288, preset: alto, driver: d3d12}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: gioco

      - name: Limite dei descrittori ${{ matrix.descrittori }}
        shell: pwsh
        run: |
          "[rendering]`nrendering_device/d3d12/max_resource_descriptors=${{ matrix.descrittori }}`n" | Out-File -Encoding ascii gioco\override.cfg
          Get-Content gioco\override.cfg

      - name: Vulkan con lo SwiftShader di Chrome
        if: matrix.driver == 'swiftshader'
        shell: pwsh
        run: |
          $icd = Get-ChildItem -Recurse "C:\Program Files\Google\Chrome\Application" -Filter 'vk_swiftshader_icd.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "ICD: $($icd.FullName)"
          "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File -Append $env:GITHUB_ENV
          "VK_DRIVER_FILES=$($icd.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Partenza ${{ matrix.partenza }}, descrittori ${{ matrix.descrittori }}, preset ${{ matrix.preset }}, ${{ matrix.driver }}
        shell: pwsh
        run: |
          $nome = "${{ matrix.partenza }}_${{ matrix.descrittori }}_${{ matrix.preset }}_${{ matrix.driver }}"
          $log = "$PWD\godot_$nome.log"
          $prova = "$PWD\prova_$nome.log"
          $drv = if ("${{ matrix.driver }}" -eq "swiftshader") { "--rendering-driver vulkan " } else { "" }
          $arg = "$drv--resolution 1280x720 --log-file `"$log`" -- --partenza=${{ matrix.partenza }} --preset=${{ matrix.preset }} --resta=60 --registro-prova=`"$prova`""
          Write-Host "ARGOMENTI: $arg"
          $p = Start-Process -FilePath gioco\JillyJubilee.exe -ArgumentList $arg -PassThru
          $fine = (Get-Date).AddMinutes(165)
          while (-not $p.HasExited -and (Get-Date) -lt $fine) {
            Start-Sleep -Seconds 5
            $p.Refresh()
            $os = Get-CimInstance Win32_OperatingSystem
            if (-not $p.HasExited) {
              Write-Host ("MEM {0:HH:mm:ss} privata={1} MB working_set={2} MB picco_ws={3} MB ram_libera={4} MB" -f (Get-Date), [int]($p.PrivateMemorySize64 / 1MB), [int]($p.WorkingSet64 / 1MB), [int]($p.PeakWorkingSet64 / 1MB), [int]($os.FreePhysicalMemory / 1KB))
            }
          }
          if (-not $p.HasExited) { Write-Host "ANCORA ACCESO dopo 165 min: lo chiudo"; $p.Kill(); $p.WaitForExit() }
          $codice = $p.ExitCode
          Write-Host ("CODICE D'USCITA: {0} (0x{1:X8})" -f $codice, $codice)
          "$nome codice=$codice" | Out-File esito.txt
          Write-Host "--- registro della prova:"
          if (Test-Path $prova) { Get-Content $prova | Select-Object -Last 25 } else { Write-Host "NESSUN REGISTRO DELLA PROVA" }
          if (Test-Path $log) {
            Write-Host "--- dal registro di Godot:"
            Select-String -Path $log -Pattern 'Using Device' | Select-Object -First 2 | ForEach-Object { $_.Line }
            Write-Host "errori dei descrittori: $((Select-String -Path $log -Pattern 'descriptor heap').Count)"
            Get-Content $log | Select-Object -Last 15
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000} -MaxEvents 1 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-${{ matrix.partenza }}-${{ matrix.descrittori }}-${{ matrix.preset }}-${{ matrix.driver }}
          path: |
            godot_*.log
            prova_*.log
            esito.txt
          retention-days: 7
